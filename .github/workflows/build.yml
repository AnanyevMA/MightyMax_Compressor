name: Build MightyMax for macOS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest  # Используем виртуальную машину Apple

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      # Обрати внимание: разделитель двоеточие (:) для Mac
      run: |
        pyinstaller --noconsole --name="MightyMax" --add-data "static:static" app.py

    # Этот шаг убирает атрибуты карантина, чтобы приложение запускалось
    # (хотя на чужом Маке всё равно придется разрешать запуск через настройки)
    - name: Sign/De-quarantine (Basic)
      run: |
        xattr -cr dist/MightyMax.app || true

    # Упаковываем .app в .zip, иначе при скачивании он сломается
    - name: Zip the App
      run: |
        cd dist
        zip -r MightyMax_Mac.zip MightyMax.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MightyMax-Mac-App
        path: dist/MightyMax_Mac.zip
