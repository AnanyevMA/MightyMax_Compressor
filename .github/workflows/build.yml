name: Build MightyMax for macOS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pyobjc-framework-WebKit

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconsole --name="MightyMax" \
          --add-data "static:static" \
          --collect-submodules webview \
          --collect-all pillow_avif \
          app.py

    # Снятие атрибутов карантина
    - name: Sign/De-quarantine (Basic)
      run: |
        xattr -cr dist/MightyMax.app || true

    # Упаковываем .app в .zip
    - name: Zip the App
      run: |
        cd dist
        zip -r MightyMax_Mac.zip MightyMax.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MightyMax-Mac-App
        path: dist/MightyMax_Mac.zip
